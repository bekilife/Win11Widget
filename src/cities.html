<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>Города</title>
  <style>
    :root { color-scheme: dark; --bg: #1f1f23; --panel: #2a2a30; --line: #3a3a42; --fg2: #a1a1aa; --accent: #0a84ff; }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 20px 22px; background: var(--bg); color: #fff;
      font: 14px "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
      display: flex; flex-direction: column; gap: 14px; height: 100vh;
    }
    h1 { font: 600 20px "Segoe UI Variable Display", "Segoe UI", sans-serif; margin: 0; }
    h2 { font-size: 12px; font-weight: 600; color: var(--fg2); text-transform: uppercase; letter-spacing: .5px; margin: 0 0 6px; }
    .hint { color: var(--fg2); font-size: 12px; margin: 0; }
    input {
      width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line);
      background: var(--panel); color: #fff; font: inherit; outline: none;
    }
    input:focus { border-color: var(--accent); }
    ul { list-style: none; margin: 0; padding: 0; border-radius: 10px; background: var(--panel); overflow: auto; }
    li { display: flex; align-items: center; gap: 8px; padding: 9px 10px 9px 14px; border-bottom: 1px solid var(--line); }
    li:last-child { border-bottom: 0; }
    li .n { flex: 1; min-width: 0; }
    li .n b { font-weight: 600; }
    li .n small { display: block; color: var(--fg2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    li .main { font-size: 11px; color: var(--accent); font-weight: 600; margin-left: 6px; }
    button {
      border: 0; border-radius: 6px; background: #3a3a42; color: #fff; font: inherit; font-size: 13px;
      min-width: 30px; height: 30px; padding: 0 10px; cursor: pointer;
    }
    button:hover { background: #4a4a54; }
    button:disabled { opacity: .35; cursor: default; }
    button.add { background: var(--accent); }
    button.add:hover { background: #3398ff; }
    button.star { background: none; color: #ffd60a; font-size: 16px; min-width: 30px; padding: 0; }
    button.star:hover { background: #3a3a42; }
    button.star.on:disabled { opacity: 1; }
    #results:empty, #results.hidden { display: none; }
    #results { max-height: 230px; flex: none; }
    #mine { flex: 1; }
    .section { display: flex; flex-direction: column; min-height: 0; }
    .section.grow { flex: 1; }
  </style>
</head>
<body>
  <h1>Города</h1>
  <div class="section">
    <input id="q" placeholder="Найти город, например «Берлин» или «Paris»" autofocus>
    <ul id="results" style="margin-top:8px"></ul>
  </div>
  <div class="section grow">
    <h2>Мои города</h2>
    <ul id="mine"></ul>
  </div>
  <p class="hint">Основной город (★) показывается крупно в виджете «Погода». Сделать основным — ☆ здесь или клик по городу в самом виджете.</p>
  <script src="cities.js"></script>
</body>
</html>
