[package]
name = "win11widget"
version = "1.0.0"
description = "macOS-style desktop widgets for Windows 11"
license = "MIT"
repository = "https://github.com/bekilife/Win11Widget"
readme = "../README.md"
rust-version = "1.85"
edition = "2021"

[lib]
name = "win11widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
base64 = "0.22"
nvml-wrapper = "0.13"
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_System_WinRT"] }
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
